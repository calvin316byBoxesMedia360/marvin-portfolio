<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Marvin Martinez — Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f2f2ee;
    --dim: #8a8a85;
    --line: #1f1f1e;
    --accent: oklch(0.86 0.09 162);
    --accent-ink: #0a0a0a;
  }
  [data-theme="light"] {
    --bg: #f2f2ee;
    --fg: #0a0a0a;
    --dim: #6a6a65;
    --line: #d9d9d2;
    --accent-ink: #0a0a0a;
  }
  [data-accent="white"] { --accent: #f2f2ee; }
  [data-accent="amber"] { --accent: oklch(0.82 0.14 70); }
  [data-accent="mint"]  { --accent: oklch(0.86 0.09 162); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    transition: background .4s ease, color .4s ease;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
  .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  /* Reusable */
  .rule { border: 0; border-top: 1px solid var(--line); margin: 0; }
  .container { max-width: 1400px; margin: 0 auto; padding: 0 32px; }
  .dim { color: var(--dim); }
  .accent { color: var(--accent); }
  .blink { animation: blink 1.2s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  /* Tweaks panel */
  .tweaks {
    position: fixed; right: 20px; bottom: 20px; z-index: 100;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
    padding: 18px 20px; width: 260px;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    display: none;
  }
  .tweaks.on { display: block; }
  .tweaks h4 { margin: 0 0 14px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; display: flex; justify-content: space-between; }
  .tweaks .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
  .tweaks .row:first-of-type { border-top: 0; }
  .tweaks label { color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .tweaks .opts { display: flex; gap: 6px; }
  .tweaks button {
    background: transparent; color: var(--fg);
    border: 1px solid var(--line); font: inherit;
    padding: 4px 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em;
    transition: all .15s ease;
  }
  .tweaks button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tweaks button:hover:not(.active) { border-color: var(--fg); }
  .swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; padding: 0; }
  .swatch.active { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* ───────── Responsive ───────── */
  /* Container-query style: match either viewport or body width */
  @media (max-width: 820px), (max-device-width: 820px) {
    .container { padding: 0 20px; }

    /* Nav */
    .nav-root { padding: 14px 20px !important; }
    .nav-logo-full { display: none; }
    .nav-logo-short { display: inline; }
    .nav-links { gap: 18px !important; }

    /* Hero */
    .hero-root { padding: 100px 20px 48px !important; min-height: auto !important; gap: 56px; }
    .hero-meta { grid-template-columns: 1fr 1fr !important; gap: 20px !important; }
    .hero-meta > div:nth-child(4) { text-align: left !important; }
    .hero-title { font-size: clamp(48px, 14vw, 88px) !important; margin: 48px 0 32px !important; line-height: 0.95 !important; }
    .hero-bottom { grid-template-columns: 1fr !important; gap: 28px !important; }
    .hero-bottom > div { grid-column: auto !important; text-align: left !important; }
    .hero-cta { width: 100%; justify-content: space-between !important; }

    /* Section headers */
    .section-head { flex-direction: column; align-items: flex-start !important; gap: 16px; }
    .section-title { font-size: clamp(36px, 10vw, 56px) !important; }

    /* Index layout */
    .index-section { padding: 80px 20px 60px !important; }
    .index-header-row, .index-row { grid-template-columns: 40px 1fr 60px !important; }
    .index-col-client, .index-col-tag { display: none; }
    .index-row-title { font-size: 20px !important; }
    .index-hover-preview { display: none !important; }

    /* Grid layout */
    .grid-section { padding: 80px 20px 60px !important; }
    .grid-list { grid-template-columns: 1fr !important; gap: 36px !important; }

    /* Stack layout */
    .stack-row { grid-template-columns: 1fr !important; gap: 28px !important; padding: 56px 20px !important; }
    .stack-row > div { order: initial !important; }
    .stack-title { font-size: clamp(32px, 9vw, 48px) !important; }

    /* About */
    .about-section { padding: 80px 20px !important; }
    .about-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
    .about-grid > div { grid-column: auto !important; }
    .about-lede { font-size: clamp(24px, 6vw, 34px) !important; margin-bottom: 48px !important; }
    .about-principles { grid-template-columns: 1fr 1fr !important; gap: 24px !important; }

    /* Footer */
    .footer-root { padding: 80px 20px 32px !important; }
    .footer-big { font-size: clamp(48px, 13vw, 80px) !important; }
    .footer-cta-row { flex-direction: column; align-items: flex-start !important; gap: 12px !important; }
    .footer-cta { width: 100%; justify-content: space-between !important; }
    .footer-bottom { grid-template-columns: 1fr 1fr !important; gap: 28px !important; margin-top: 56px !important; }
    .footer-bottom > div:last-child { text-align: left !important; }

    /* Tweaks panel — make smaller on mobile */
    .tweaks { right: 12px; bottom: 12px; left: 12px; width: auto; padding: 14px 16px; }
  }

  /* Also trigger mobile layout when body is narrow, regardless of viewport */
  body.is-narrow .nav-root { padding: 14px 20px !important; }
  body.is-narrow .nav-logo-full { display: none; }
  body.is-narrow .nav-logo-short { display: inline; }
  body.is-narrow .nav-links { gap: 18px !important; }
  body.is-narrow .hero-root { padding: 100px 20px 48px !important; min-height: auto !important; }
  body.is-narrow .hero-meta { grid-template-columns: 1fr 1fr !important; gap: 20px !important; }
  body.is-narrow .hero-meta > div:nth-child(4) { text-align: left !important; }
  body.is-narrow .hero-title { font-size: clamp(44px, 13vw, 80px) !important; margin: 48px 0 32px !important; line-height: 0.95 !important; }
  body.is-narrow .hero-bottom { grid-template-columns: 1fr !important; gap: 28px !important; }
  body.is-narrow .hero-bottom > div { grid-column: auto !important; text-align: left !important; }
  body.is-narrow .hero-cta { width: 100%; justify-content: space-between !important; }
  body.is-narrow .section-head { flex-direction: column; align-items: flex-start !important; gap: 16px; }
  body.is-narrow .section-title { font-size: clamp(36px, 10vw, 56px) !important; }
  body.is-narrow .index-section { padding: 80px 20px 60px !important; }
  body.is-narrow .index-header-row, body.is-narrow .index-row { grid-template-columns: 40px 1fr 60px !important; }
  body.is-narrow .index-col-client, body.is-narrow .index-col-tag { display: none !important; }
  body.is-narrow .index-row-title { font-size: 20px !important; }
  body.is-narrow .index-hover-preview { display: none !important; }
  body.is-narrow .grid-section { padding: 80px 20px 60px !important; }
  body.is-narrow .grid-list { grid-template-columns: 1fr !important; gap: 36px !important; }
  body.is-narrow .stack-row { grid-template-columns: 1fr !important; gap: 28px !important; padding: 56px 20px !important; }
  body.is-narrow .stack-row > div { order: initial !important; }
  body.is-narrow .stack-title { font-size: clamp(32px, 9vw, 48px) !important; }
  body.is-narrow .about-section { padding: 80px 20px !important; }
  body.is-narrow .about-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
  body.is-narrow .about-grid > div { grid-column: auto !important; }
  body.is-narrow .about-lede { font-size: clamp(24px, 6vw, 34px) !important; margin-bottom: 48px !important; }
  body.is-narrow .about-principles { grid-template-columns: 1fr 1fr !important; gap: 24px !important; }
  body.is-narrow .footer-root { padding: 80px 20px 32px !important; }
  body.is-narrow .footer-big { font-size: clamp(48px, 13vw, 80px) !important; }
  body.is-narrow .footer-cta-row { flex-direction: column; align-items: flex-start !important; gap: 12px !important; }
  body.is-narrow .footer-cta { width: 100%; justify-content: space-between !important; }
  body.is-narrow .footer-bottom { grid-template-columns: 1fr 1fr !important; gap: 28px !important; margin-top: 56px !important; }
  body.is-narrow .footer-bottom > div:last-child { text-align: left !important; }
  body.is-narrow .tweaks { right: 12px; bottom: 12px; left: 12px; width: auto; padding: 14px 16px; }
  body.is-very-narrow .about-principles { grid-template-columns: 1fr !important; }
  body.is-very-narrow .footer-bottom { grid-template-columns: 1fr !important; }

  @media (max-width: 480px) {
    .about-principles { grid-template-columns: 1fr !important; }
    .footer-bottom { grid-template-columns: 1fr !important; }
  }

  /* Default state for mobile-only swap elements */
  .nav-logo-short { display: none; }
</style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Tweakable defaults — persisted to disk via host
    window.__TWEAKS = /*EDITMODE-BEGIN*/{
      "layout": "index",
      "theme": "dark",
      "accent": "mint",
      "showNumbers": true
    }/*EDITMODE-END*/;
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/data.jsx"></script>

  <script type="text/babel" src="src/About.jsx"></script>

  <script type="text/babel" src="src/Tweaks.jsx"></script>
  <script type="text/babel" src="src/App.jsx"></script>
</body>
</html>
